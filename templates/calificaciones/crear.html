{% extends 'base.html' %}
{% block title %}Crear calificacion{% endblock %}
{% block content %}
<div class="card border-0 shadow rounded-4">
  <div class="card-body p-4">
    <h2 class="h4 mb-3">Registrar calificacion</h2>
    <form method="post" class="row g-3">
      {% csrf_token %}
      {% for field in form %}
      <div class="col-md-6">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <div class="text-danger small">{{ field.errors|join:', ' }}</div>
        {% endif %}
      </div>
      {% endfor %}
      <div class="col-12 d-flex gap-2">
        <button class="btn btn-success" type="submit">Guardar</button>
        <a class="btn btn-secondary" href="{% url 'listar_calificaciones' %}">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
